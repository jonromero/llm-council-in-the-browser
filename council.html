// ── Chat Interface ─────────────────────────────────────────
const ACCEPT = 'image/*,application/pdf,text/plain,text/markdown,text/csv,application/json';

function ChatInterface({ conversation, onSend, isLoading, onStop, onRedo, onChangeModel, convUsage }) {
  const [input, setInput] = useState('');
  const [atts, setAtts] = useState([]);
  const [rawFiles, setRawFiles] = useState([]);
  const [processingFiles, setProcessingFiles] = useState(false);
  const [dragging, setDragging] = useState(false);
  const endRef = useRef(), fileRef = useRef();

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [conversation]);

  const addFiles = async (files) => {
    if (!files || !files.length) return;
    const valid = Array.from(files).filter(f => {
      if (f.size > 20 * 1024 * 1024) { alert(`"${f.name}" exceeds 20MB.`); return false; } return true;
    });
    if (!valid.length) return;
    setProcessingFiles(true);
    try {
      const processed = await processFiles(valid);
      setAtts(p => [...p, ...processed]);
      setRawFiles(p => [...p, ...valid]);
    } finally { setProcessingFiles(false); }
  };

  const removeAtt = i => { setAtts(p => p.filter((_, j) => j !== i)); setRawFiles(p => p.filter((_, j) => j !== i)); };

  const submit = e => {
    e.preventDefault();
    if ((input.trim() || atts.length) && !isLoading && !processingFiles) {
      onSend(input, atts, rawFiles);
      setInput(''); setAtts([]); setRawFiles([]);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  const keydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(e); } };

  const print = content => {
    const w = window.open('', '_blank');
    if (!w) { alert('Allow popups to print.'); return; }
    const html = typeof marked !== 'undefined' ? marked.parse(content) : content.replace(/\n/g, '<br>');
    w.document.write(`<!DOCTYPE html><html><head><title>Council Report</title><style>
      body{font-family:Georgia,serif;max-width:760px;margin:40px auto;color:#111;line-height:1.7;font-size:14px}
      h1,h2,h3,h4{font-family:monospace;margin:1.4em 0 .5em;font-size:1em;text-transform:uppercase;letter-spacing:.5px}
      p{margin:0 0 .9em}
      table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1em}
      th,td{border:1px solid #ccc;padding:6px 10px;text-align:left}
      th{background:#f5f5f5;font-weight:700}
      code{background:#f0f0f0;padding:1px 5px;font-family:monospace;font-size:.9em}
      pre{background:#f0f0f0;padding:12px;overflow-x:auto;font-size:12px}
      pre code{background:none;padding:0}
      blockquote{border-left:3px solid #ccc;margin:0 0 1em;padding-left:14px;color:#555}
      ul,ol{padding-left:24px;margin-bottom:1em}
      li{margin-bottom:.3em}
      hr{border:none;border-top:1px solid #ddd;margin:1.5em 0}
      strong{font-weight:700}
      @media print{body{margin:20px}}
    </style></head><body>${html}<script>window.onload=()=>{window.print()}<\/script></body></html>`);
    w.document.close();
  };

  if (!conversation) return (
    <div className="chat-main">
      <div className="msgs"><div className="empty-state"><div className="empty-logo">~^</div><div>select or create a conversation</div></div></div>
    </div>
  );

  return (
    <div className="chat-main" onDragOver={e => { e.preventDefault(); setDragging(true); }}
      onDragLeave={() => setDragging(false)} onDrop={e => { e.preventDefault(); setDragging(false); addFiles(e.dataTransfer.files); }}>

      {isLoading && (
        <div className="proc-banner">
          <div className="spin"></div>
          <div><strong>council deliberating…</strong><span>do not close this page.</span></div>
        </div>
      )}

      <div className="msgs">
        {conversation.messages.length === 0 ? (
          <div className="empty-state">
            <div className="empty-logo">~^</div>
            <div>ask your question below</div>
            <div className="empty-hint">attach photos or PDFs for context</div>
            <ProHint />
          </div>
        ) : conversation.messages.map((msg, idx) => (
          <div key={idx} className="msg-group">
            {msg.role === 'user' ? (
              <div className="user-msg">
                <div className="msg-label">you</div>
                <div className="msg-content">
                  {msg.attachmentNames && msg.attachmentNames.length > 0 && (
                    <div className="attach-row">
                      {msg.attachmentNames.map((n, i) => <span key={i} className="attach-chip">📎 {n}</span>)}
                    </div>
                  )}
                  <Md>{msg.content}</Md>
                </div>
              </div>
            ) : (
              <div className="assistant-msg">
                <div className="msg-label">~^ council</div>
                {msg.loading?.stage1 && <div className="stage-loading"><div className="spin"></div><span>stage 1: collecting responses…</span></div>}
                {msg.stage1 && <Stage1 responses={msg.stage1}
                  onRedo={(si, mn) => onRedo && onRedo(idx, si, mn)}
                  onChangeModel={(si, om, nm) => onChangeModel && onChangeModel(idx, si, om, nm)} />}
                {msg.loading?.stage2 && <div className="stage-loading"><div className="spin"></div><span>stage 2: peer rankings…</span></div>}
                {msg.stage2 && <Stage2 rankings={msg.stage2} labelToModel={msg.metadata?.label_to_model} aggregateRankings={msg.metadata?.aggregate_rankings} />}
                {msg.loading?.stage3 && <div className="stage-loading"><div className="spin"></div><span>stage 3: synthesising verdict…</span></div>}
                {msg.stage3 && (
                  <div className="stage3-wrap">
                    <Stage3 finalResponse={msg.stage3} />
                    <button className="print-btn" onClick={() => print(msg.stage3.response)}>print report →</button>
                  </div>
                )}
              </div>
            )}
          </div>
        ))}
        <div ref={endRef} />
      </div>

      <form className="input-wrap" onSubmit={submit}>
        {atts.length > 0 && (
          <div className="attach-preview">
            {atts.map((a, i) => (
              <div key={i} className="ap-chip">
                {a.type === 'image' ? <img src={a.content} alt={a.name} /> : <span>{a.mimeType === 'application/pdf' ? '📄' : '📝'}</span>}
                <span className="ap-name" title={a.name}>{a.name.length > 22 ? a.name.slice(0,20)+'…' : a.name}</span>
                <button type="button" className="ap-del" onClick={() => removeAtt(i)}>×</button>
              </div>
            ))}
            {processingFiles && <div className="ap-chip"><div className="spin" style={{width:12,height:12}}></div><span style={{color:'var(--dim)',fontSize:11}}>processing…</span></div>}
          </div>
        )}
        <div className="input-row">
          <button type="button" className="attach-btn" onClick={() => fileRef.current?.click()} disabled={isLoading || processingFiles} title="attach file">📎</button>
          <input ref={fileRef} type="file" accept={ACCEPT} multiple style={{ display:'none' }} onChange={e => addFiles(e.target.files)} />
          <textarea className="msg-input" rows={3}
            placeholder={conversation.messages.length === 0 ? '> ask the council…' : '> follow-up question… (full council re-run)'}
            value={input} onChange={e => setInput(e.target.value)} onKeyDown={keydown}
            disabled={isLoading || processingFiles} />
          {isLoading ? (
            <button type="button" className="stop-btn" onClick={onStop}>■ stop</button>
          ) : (
            <button type="submit" className="send-btn" disabled={(!input.trim() && !atts.length) || processingFiles}>
              send →
            </button>
          )}
        </div>
        {convUsage && (convUsage.promptTokens + convUsage.completionTokens) > 0 && (
          <div style={{display:'flex',gap:16,fontSize:10,color:'var(--faint)',padding:'5px 2px 0',fontFamily:'var(--mono)'}}>
            <span>conversation: <strong style={{color:'var(--dim)'}}>{formatTokens(convUsage.promptTokens + convUsage.completionTokens)} tokens</strong></span>
            <span style={{color:'var(--border2)'}}>│</span>
            <span>{formatTokens(convUsage.promptTokens)} in · {formatTokens(convUsage.completionTokens)} out</span>
            <span style={{color:'var(--border2)'}}>│</span>
            <span>est. <strong style={{color:'var(--dim)'}}>{formatCost(estimateCost(convUsage.promptTokens, convUsage.completionTokens))}</strong></span>
            <span style={{color:'var(--border2)'}}>│</span>
            <span>{convUsage.calls} API call{convUsage.calls !== 1 ? 's' : ''}</span>
          </div>
        )}
      </form>
    </div>
  );
}

// ── Export / Import Modal ──────────────────────────────────
function ExportImportModal({ onClose, costData }) {
  const { apiKey, models, chairman, localAiUrl } = useSettings();
  const [inclConvs, setInclConvs] = useState(true);
  const [inclSettings, setInclSettings] = useState(true);
  const [inclCost, setInclCost] = useState(false);
  const [importResult, setImportResult] = useState(null); // null | {ok, msg}
  const importRef = useRef();

  const doExport = () => {
    const out = { version: 1, exported_at: new Date().toISOString() };
    if (inclConvs) {
      const list = storage.list();
      out.conversations = list.map(meta => storage.get(meta.id)).filter(Boolean);
    }
    if (inclSettings) {
      out.settings = { apiKey, models, chairman, localAiUrl };
    }
    if (inclCost) {
      out.costStats = costData;
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `llm-council-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  const doImport = async (file) => {
    if (!file) return;
    try {
      const text = await fileToText(file);
      const data = JSON.parse(text);
      if (!data.version) throw new Error('Not a valid council backup file.');
      let msgs = [];

      if (data.conversations && Array.isArray(data.conversations)) {
        let imported = 0;
        for (const conv of data.conversations) {
          if (!conv.id || !conv.messages) continue;
          localStorage.setItem(`${LS_PRE}${conv.id}`, JSON.stringify(conv));
          imported++;
        }
        // Rebuild list from all LS keys
        const allIds = Object.keys(localStorage).filter(k => k.startsWith(LS_PRE)).map(k => k.slice(LS_PRE.length));
        const list = allIds.map(id => {
          const c = storage.get(id);
          return c ? { id: c.id, created_at: c.created_at, title: c.title || 'New Conversation', message_count: c.messages.length } : null;
        }).filter(Boolean).sort((a,b) => b.created_at.localeCompare(a.created_at));
        storage.saveList(list);
        msgs.push(`${imported} conversation(s) imported`);
      }

      if (data.settings) {
        const s = data.settings;
        if (s.apiKey) localStorage.setItem('openRouterApiKey', s.apiKey);
        if (s.models) localStorage.setItem('councilModels', JSON.stringify(s.models));
        if (s.chairman) localStorage.setItem('chairmanModel', s.chairman);
        if (s.localAiUrl !== undefined) { s.localAiUrl ? localStorage.setItem('localAiUrl', s.localAiUrl) : localStorage.removeItem('localAiUrl'); }
        msgs.push('settings restored');
      }

      if (data.costStats) {
        localStorage.setItem(LS_COST, JSON.stringify(data.costStats));
        msgs.push('cost stats restored');
      }

      setImportResult({ ok: true, msg: `✓ Imported: ${msgs.join(', ')}. Reload to apply.` });
    } catch(e) {
      setImportResult({ ok: false, msg: `✗ Import failed: ${e.message}` });
    }
  };

  return (
    <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">~^ export / import</div>

        <div className="modal-section">
          <div className="modal-section-title">Export</div>
          <p style={{fontSize:12,color:'var(--dim)',marginBottom:12}}>Choose what to include in the backup file.</p>

          <label className="export-check-row">
            <input type="checkbox" checked={inclConvs} onChange={e => setInclConvs(e.target.checked)} />
            <div>
              <span className="export-check-label">Conversations</span>
              <span className="export-check-desc">all messages, responses and council stage data</span>
            </div>
          </label>
          <label className="export-check-row">
            <input type="checkbox" checked={inclSettings} onChange={e => setInclSettings(e.target.checked)} />
            <div>
              <span className="export-check-label">Settings</span>
              <span className="export-check-desc">API key, model list, chairman, local AI URL</span>
            </div>
          </label>
          <label className="export-check-row">
            <input type="checkbox" checked={inclCost} onChange={e => setInclCost(e.target.checked)} />
            <div>
              <span className="export-check-label">Cost Stats</span>
              <span className="export-check-desc">session token counts and estimated spend</span>
            </div>
          </label>

          {inclSettings && (
            <div className="export-warn">⚠ Your API key will be included in the backup file. Keep it safe and don't share it publicly.</div>
          )}

          <button className="btn-save" onClick={doExport} disabled={!inclConvs && !inclSettings && !inclCost}
            style={{marginTop:4}}>
            download backup →
          </button>
        </div>

        <div className="modal-section">
          <div className="modal-section-title">Import</div>
          <p style={{fontSize:12,color:'var(--dim)',marginBottom:12}}>Restore from a previously exported backup. Existing conversations are kept; imported ones are merged in.</p>
          <input ref={importRef} type="file" accept=".json,application/json" style={{display:'none'}} onChange={e => doImport(e.target.files[0])} />
          <div className="import-drop" onClick={() => importRef.current?.click()}>
            click to select a backup .json file
          </div>
          {importResult && (
            <div className={`import-result ${importResult.ok ? 'ok' : 'err'}`}>
              {importResult.msg}
              {importResult.ok && <button onClick={() => location.reload()}
                style={{marginLeft:10,background:'none',border:'1px solid #80c890',color:'#2a8040',padding:'2px 8px',fontSize:11,fontFamily:'var(--mono)',cursor:'pointer'}}>reload now →</button>}
            </div>
          )}
        </div>

        <div className="modal-actions">
          <button className="btn-cancel" onClick={onClose}>close</button>
        </div>
      </div>
    </div>
  );
}

// ── Sidebar ────────────────────────────────────────────────
function Sidebar({ convs, currentId, onSelect, onNew, onDelete, onSettings, onExport, isOpen, onClose, costData }) {
  const totalTokens = (costData.promptTokens || 0) + (costData.completionTokens || 0);
  const estCost = estimateCost(costData.promptTokens || 0, costData.completionTokens || 0);
  return (
    <>
      {isOpen && <div className="sb-overlay" onClick={onClose} />}
      <div className={`sidebar${isOpen ? ' open' : ''}`}>
        <div className="sb-head">
          <div className="sb-logo">~^<small>LLM Council</small></div>
          <button className="sb-btn primary" onClick={onNew}>new conversation</button>
          <button className="sb-btn" onClick={onSettings}>settings</button>
          <button className="sb-btn" onClick={onExport}>export / import</button>
        </div>
        <div className="sb-list">
          {convs.length === 0 ? <div className="sb-empty">no conversations yet.</div> : convs.map(c => (
            <div key={c.id} className={`conv-item${c.id === currentId ? ' active' : ''}`} onClick={() => onSelect(c.id)}>
              <div>
                <div className="conv-title">{c.title || 'New Conversation'}</div>
                <div className="conv-meta">{c.message_count} msg</div>
              </div>
              <button className="conv-del" onClick={e => { e.stopPropagation(); if (confirm('Delete?')) onDelete(c.id); }}>×</button>
            </div>
          ))}
        </div>
        <div className="sb-foot">
          {totalTokens > 0 && (
            <div className="sb-cost">
              <span className="sb-cost-lbl">session usage</span>
              <span className="sb-cost-val">{formatTokens(totalTokens)} tokens</span>
              <span className="sb-cost-sub">
                {formatTokens(costData.promptTokens||0)} in · {formatTokens(costData.completionTokens||0)} out
              </span>
              <span className="sb-cost-sub">est. cost: {formatCost(estCost)} <span title="rough estimate for non-free models; free models cost $0" style={{cursor:'help',opacity:.6}}>ⓘ</span></span>
              <button onClick={() => { saveCostData({ promptTokens:0, completionTokens:0, calls:0, sessionStart:Date.now() }); location.reload(); }}
                style={{background:'none',border:'none',color:'var(--faint)',fontSize:9,cursor:'pointer',textAlign:'left',padding:'2px 0',fontFamily:'var(--mono)',textDecoration:'underline'}}>reset counter</button>
            </div>
          )}
          <a href="https://github.com/jonromero/llm-council-in-the-browser" target="_blank" rel="noopener" className="sb-foot-link">fork on github →</a>
          <a href="https://lastmachine.com" target="_blank" rel="noopener" className="sb-foot-link">lastmachine.com →</a>
        </div>
      </div>
    </>
  );
}

// ── App ────────────────────────────────────────────────────
function App() {
  const { apiKey, models, chairman, localAiUrl, isConfigured } = useSettings();
  const [convs, setConvs] = useState([]);
  const [currentId, setCurrentId] = useState(null);
  const [conversation, setConversation] = useState(null);
  const [loading, setLoading] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [showIntro, setShowIntro] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [notif, setNotif] = useState(null);
  const [costData, setCostData] = useState(loadCostData);
  const [convUsage, setConvUsage] = useState({});  // per-conversation token totals
  const abortCtrlRef = useRef(null);

  useEffect(() => {
    const seen = localStorage.getItem('llm_council_intro_seen');
    if (!seen) setShowIntro(true);
    else if (!isConfigured) setShowSettings(true);
  }, []);

  useEffect(() => {
    const list = storage.list();
    setConvs(list);
    // Always land on a conversation — use the most recent or create a new one
    if (list.length > 0) {
      setCurrentId(list[0].id);
    } else {
      const c = storage.create();
      setConvs(storage.list());
      setCurrentId(c.id);
    }
  }, []);
  useEffect(() => { if (currentId) setConversation(storage.get(currentId)); else setConversation(null); }, [currentId]);


  const loadConvs = () => { setConvs(storage.list()); };
  const notify = (msg, type = 'info') => setNotif({ message: msg, type });

  const addUsage = (usage) => {
    setCostData(prev => {
      const next = {
        ...prev,
        promptTokens: (prev.promptTokens || 0) + (usage.prompt_tokens || 0),
        completionTokens: (prev.completionTokens || 0) + (usage.completion_tokens || 0),
        calls: (prev.calls || 0) + 1,
      };
      saveCostData(next);
      return next;
    });
    setConvUsage(prev => {
      const id = currentId; if (!id) return prev;
      const cur = prev[id] || { promptTokens: 0, completionTokens: 0, calls: 0 };
      return { ...prev, [id]: {
        promptTokens: cur.promptTokens + (usage.prompt_tokens || 0),
        completionTokens: cur.completionTokens + (usage.completion_tokens || 0),
        calls: cur.calls + 1,
      }};
    });
  };

  const handleStop = () => {
    if (abortCtrlRef.current) {
      abortCtrlRef.current.abort();
      abortCtrlRef.current = null;
    }
    setLoading(false);
    // Finalize any in-progress assistant message
    if (currentId) {
      const conv = storage.get(currentId);
      if (conv) {
        const last = conv.messages[conv.messages.length - 1];
        if (last && last.role === 'assistant' && last.loading) {
          last.loading = { stage1: false, stage2: false, stage3: false };
          if (!last.stage3) last.stage3 = last.stage1 ? null : null; // keep whatever completed
          storage.save(conv); setConversation({ ...conv });
        }
      }
    }
    notify('Council stopped.', 'warning');
  };

  const handleSend = async (content, atts = [], rawFiles = []) => {
    if (!currentId) return;
    if (!isConfigured) { notify('configure your api key (or local AI url) in settings.', 'error'); return; }
    setLoading(true);
    const conv = storage.get(currentId);
    conv.messages.push({ role: 'user', content: content || '', attachmentNames: atts.map(a => a.name) });
    storage.save(conv); setConversation({ ...conv });

    const assistantMsg = { role: 'assistant', stage1: null, stage2: null, stage3: null, metadata: null, loading: { stage1: false, stage2: false, stage3: false } };
    conv.messages.push(assistantMsg); storage.save(conv); setConversation({ ...conv });
    const prevMsgs = conv.messages.slice(0, conv.messages.length - 2);
    const council = new Council(apiKey, models, chairman, localAiUrl);

    const ctrl = new AbortController();
    abortCtrlRef.current = ctrl;

    await council.run(content, (evt, data) => {
      const c = storage.get(currentId); if (!c) return;
      const last = c.messages[c.messages.length - 1];
      switch (evt) {
        case 'stage1_start': last.loading.stage1 = true; break;
        case 'stage1_complete': last.stage1 = data; last.loading.stage1 = false; break;
        case 'stage2_start': last.loading.stage2 = true; break;
        case 'stage2_complete': last.stage2 = data.data; last.metadata = data.metadata; last.loading.stage2 = false; break;
        case 'stage3_start': last.loading.stage3 = true; break;
        case 'stage3_complete': last.stage3 = data; last.loading.stage3 = false; break;
        case 'title_complete': storage.updateTitle(currentId, data); loadConvs(); break;
        case 'usage': addUsage(data.usage); break;
        case 'warning': notify(data.message, 'warning'); break;
        case 'error': last.error = data.message; notify(data.message, 'error'); setLoading(false); break;
        case 'aborted': last.loading = { stage1: false, stage2: false, stage3: false }; setLoading(false); break;
        case 'complete': setLoading(false); abortCtrlRef.current = null; break;
      }
      if (!['title_complete','warning','error','usage'].includes(evt)) storage.save(c);
      setConversation({ ...c });
    }, atts, prevMsgs, ctrl.signal);
  };

  const handleRedo = async (msgIdx, slotIdx, modelName) => {
    if (!currentId || !isConfigured) return;
    const conv = storage.get(currentId);
    const userMsg = conv.messages.slice(0, msgIdx).reverse().find(m => m.role === 'user');
    if (!userMsg || !conv.messages[msgIdx]?.stage1) return;
    conv.messages[msgIdx].stage1[slotIdx] = { ...conv.messages[msgIdx].stage1[slotIdx], loading: true };
    storage.save(conv); setConversation({ ...conv });
    const council = new Council(apiKey, models, chairman, localAiUrl);
    const history = council.buildHistory(conv.messages.slice(0, msgIdx - 1));
    const content = await council.querySingle(modelName, userMsg.content, [], history, (e, d) => {
      if (e === 'warning') notify(d.message, 'warning');
      if (e === 'usage') addUsage(d.usage);
    });
    const c2 = storage.get(currentId);
    if (c2?.messages[msgIdx]?.stage1) { c2.messages[msgIdx].stage1[slotIdx] = { model: modelName, response: content || 'Error: no response.', loading: false }; storage.save(c2); setConversation({ ...c2 }); }
  };

  const handleChangeModel = async (msgIdx, slotIdx, oldModel, newModel) => {
    if (!currentId || !isConfigured || !newModel || newModel === oldModel) return;
    const conv = storage.get(currentId);
    if (!conv?.messages[msgIdx]?.stage1) return;
    conv.messages[msgIdx].stage1[slotIdx] = { model: newModel, response: null, loading: true };
    storage.save(conv); setConversation({ ...conv });
    const userMsg = conv.messages.slice(0, msgIdx).reverse().find(m => m.role === 'user');
    if (!userMsg) return;
    const council = new Council(apiKey, models, chairman, localAiUrl);
    const history = council.buildHistory(conv.messages.slice(0, msgIdx - 1));
    const content = await council.querySingle(newModel, userMsg.content, [], history, (e, d) => {
      if (e === 'warning') notify(d.message, 'warning');
      if (e === 'usage') addUsage(d.usage);
    });
    const c2 = storage.get(currentId);
    if (c2?.messages[msgIdx]?.stage1) { c2.messages[msgIdx].stage1[slotIdx] = { model: newModel, response: content || 'Error: no response.', loading: false }; storage.save(c2); setConversation({ ...c2 }); }
  };

  return (
    <div className="app">
      <button className="ham-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>☰</button>
      <Sidebar convs={convs} currentId={currentId} costData={costData}
        onSelect={id => { setCurrentId(id); setSidebarOpen(false); }}
        onNew={() => { const c = storage.create(); setConvs(storage.list()); setCurrentId(c.id); setSidebarOpen(false); }}
        onDelete={id => { storage.delete(id); setConvs(storage.list()); if (currentId === id) setCurrentId(null); }}
        onSettings={() => { setShowSettings(true); setSidebarOpen(false); }}
        onExport={() => { setShowExport(true); setSidebarOpen(false); }}
        isOpen={sidebarOpen} onClose={() => setSidebarOpen(false)} />
      <ChatInterface conversation={conversation} onSend={handleSend} isLoading={loading}
        convUsage={currentId ? convUsage[currentId] : null}
        onStop={handleStop} onRedo={handleRedo} onChangeModel={handleChangeModel} />
      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} />}
      {showExport && <ExportImportModal onClose={() => setShowExport(false)} costData={costData} />}
      {showIntro && <IntroModal onClose={() => { localStorage.setItem('llm_council_intro_seen','true'); setShowIntro(false); if (!isConfigured) setShowSettings(true); }} />}
      {notif && <Notification message={notif.message} type={notif.type} onClose={() => setNotif(null)} />}
    </div>
  );
}

// ── Render ─────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(
  <SettingsProvider><App /></SettingsProvider>
);
</script>
</body>
</html>
